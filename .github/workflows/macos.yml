name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test shortcut core
        run: swift test
      - name: Package app
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OpenRight-macOS
          path: |
            dist/OpenRight-*.zip
            dist/OpenRight-*.zip.sha256
          if-no-files-found: error
